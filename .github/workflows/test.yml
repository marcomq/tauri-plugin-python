name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - name: checkout plugin
        uses: actions/checkout@v4
        with:
          path: tauri-plugin-python

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri-plugin-python

      - name: install dependencies (ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: rustfmt
        working-directory: tauri-plugin-python
        run: cargo fmt --all --check

      - name: clippy (pyo3 / default)
        working-directory: tauri-plugin-python
        run: cargo clippy --all-targets -- -D warnings

      - name: clippy (rustpython)
        working-directory: tauri-plugin-python
        run: cargo clippy --no-default-features --features rustpython --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
        backend: [pyo3, rustpython]
    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout plugin
        uses: actions/checkout@v4
        with:
          path: tauri-plugin-python

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri-plugin-python
          key: ${{ matrix.backend }}

      - name: install dependencies (ubuntu)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # PyO3 embeds CPython, so a Python interpreter must be available to build & run.
      - name: setup python
        if: matrix.backend == 'pyo3'
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: test (pyo3 / default)
        if: matrix.backend == 'pyo3'
        working-directory: tauri-plugin-python
        run: cargo test --all-targets

      # RustPython needs no Python installed; run it single-threaded (each test
      # spins up a full embedded interpreter on a large-stack worker thread).
      - name: test (rustpython)
        if: matrix.backend == 'rustpython'
        working-directory: tauri-plugin-python
        run: cargo test --no-default-features --features rustpython -- --test-threads=1

  # Deployment-recipe smoke test: build the plain-javascript example as a real
  # release bundle and verify the Python sources actually ship as tauri
  # resources (the #1 "works in dev, not in prod" failure). Uses the default
  # PyO3 backend and the *local* plugin (the example depends on it via path).
  example-bundle:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: examples/plain-javascript
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/plain-javascript/src-tauri

      # PyO3 links CPython, so a Python interpreter must be present to build & run.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: install dependencies (ubuntu)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install frontend dependencies
        run: npm install

      - name: build example (release bundle)
        run: npm run tauri build

      - name: verify Python sources are bundled
        run: python verify_bundle.py src-tauri/target

      # Best-effort startup check (Linux only - GUI apps need a display). If the
      # bundled binary starts and stays alive, Python initialized without
      # panicking on startup. The plugin `.expect()`s during init, so a missing
      # main.py / broken interpreter would crash the process immediately.
      - name: smoke-launch the built binary (linux)
        if: matrix.os == 'ubuntu-22.04'
        working-directory: examples/plain-javascript/src-tauri
        run: |
          sudo apt-get install -y xvfb
          BIN=$(find target/release -maxdepth 1 -type f -perm -u+x ! -name '*.so' | head -n1)
          echo "Launching: $BIN"
          xvfb-run -a "$BIN" &
          PID=$!
          sleep 8
          if kill -0 "$PID" 2>/dev/null; then
            echo "OK: app still running after startup - Python initialized without crashing."
            kill "$PID" 2>/dev/null || true
          else
            echo "FAIL: app exited during startup (Python init likely panicked)."
            exit 1
          fi

  cli:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: npm install
      - run: npm run typecheck
      - run: npm test

  # End-to-end deployment check: bundle a standalone Python with the CLI, build
  # an installable app and start it from the install location with a minimal
  # environment. The probe main.py reports which Python ran and what imports.
  bundled-python:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundle: app
          - os: ubuntu-22.04
            bundle: deb
          - os: windows-latest
            bundle: nsis
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: examples/plain-javascript
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/plain-javascript/src-tauri
          key: bundled-python

      - name: install dependencies (ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb

      - name: use probe main.py
        run: |
          cp ci/probe_main.py src-tauri/src-python/main.py
          echo markupsafe > src-tauri/src-python/requirements.txt

      - name: bundle standalone Python
        run: node ../../cli/bin/cli.js setup

      - name: doctor (before build)
        run: node ../../cli/bin/cli.js doctor

      - name: build
        run: |
          npm install
          npm run tauri build -- --bundles ${{ matrix.bundle }}

      - name: doctor (after build)
        run: node ../../cli/bin/cli.js doctor

      - name: install app
        id: install
        run: |
          DEST="$RUNNER_TEMP/installed"
          BUNDLE=src-tauri/target/release/bundle
          case "${{ runner.os }}" in
            macOS)
              mkdir -p "$DEST" && cp -R $BUNDLE/macos/*.app "$DEST/"
              EXE=$(ls "$DEST"/*.app/Contents/MacOS/*) ;;
            Linux)
              dpkg -x $BUNDLE/deb/*.deb "$DEST"
              EXE=$(ls "$DEST"/usr/bin/* | head -n1) ;;
            Windows)
              WIN_DEST=$(cygpath -w "$DEST")
              $BUNDLE/nsis/*-setup.exe //S "//D=$WIN_DEST"
              EXE=$(ls "$DEST"/*.exe | grep -vi uninstall | head -n1) ;;
          esac
          # The source copy must not be reachable as fallback.
          rm -rf src-tauri/pyembed
          echo "exe=$EXE" >> "$GITHUB_OUTPUT"

      - name: start installed app
        run: |
          REPORT="$RUNNER_TEMP/report.txt"
          if [ "${{ runner.os }}" = Linux ]; then
            xvfb-run -a node ci/launch_bundled.mjs "${{ steps.install.outputs.exe }}" "$REPORT"
          else
            node ci/launch_bundled.mjs "${{ steps.install.outputs.exe }}" "$REPORT"
          fi
